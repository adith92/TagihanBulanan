# Existing resources are already created. Do NOT re-apply as a new Blueprint in the same workspace.
# DB dpg-dbequp9srm7s73d2g0eg-a | Web srv-dbeqv45g1s2s73dgohtg
services:
  - type: web
    name: tagihanbulanan
    runtime: node
    plan: free
    region: singapore
    branch: render/postgres-v4
    repo: https://github.com/adith92/TagihanBulanan
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: INITIAL_SEED_KEY
        sync: false
